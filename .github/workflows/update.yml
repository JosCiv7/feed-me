# Haalt het nieuws op, vertaalt het en zet de app online via GitHub Pages.
name: Nieuws bijwerken

on:
  schedule:
    # GitHub voert maar een klein deel van de geplande runs echt uit (gemeten in november 2026: ± 3,4 per dag bij
    # één per halfuur). Hoe meer momenten, hoe meer kans; nooit op :00 of :30, dan is GitHub het drukst.
    - cron: "7,22,37,52 * * * *"
    # 's ochtends extra kansen: 4-6 uur UTC = 5-7 uur Belgische tijd in de winter (6-8 uur in de zomer)
    - cron: "2,12,17,27,32,42,47,57 4-5 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      # vaste versies (requirements.lock): een nieuwe versie van een pakket kan de update niet onverwacht breken
      - run: pip install -r requirements.txt -c requirements.lock

      # vertaalmodellen (± 170 MB) maar één keer downloaden
      - uses: actions/cache@v4
        with:
          path: fetcher/models
          key: argos-models-v2-fr-en-es

      # foto- en vertaalcache van de vorige run hergebruiken
      - uses: actions/cache@v4
        with:
          path: fetcher/cache
          key: feed-cache-${{ github.run_id }}
          restore-keys: feed-cache-

      # FEEDME_KEY = wachtwoord waarmee de volledige artikels versleuteld worden
      # Stap 1: nieuws ophalen en titels vertalen, en dat meteen online zetten (± 3 minuten)
      # De namen van deze stappen leest de app om de voortgang te tonen (STEP in app/app.js): niet wijzigen zonder ook daar.
      # -u: alles meteen in het logboek, ook als het programma crasht. Crasht het toch, dan nog één keer proberen.
      - name: Nieuws ophalen
        run: |
          python -u fetcher/fetch_news.py --fast || {
            echo "::warning::Het ophalen liep vast; nog één keer proberen"
            sleep 10
            python -u fetcher/fetch_news.py --fast
          }
        env:
          FEEDME_KEY: ${{ secrets.FEEDME_KEY }}

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          name: pages-stap1
          path: app
      # De lijst met pakketten bij GitHub loopt soms enkele seconden achter op de upload ("No artifacts named ... were
      # found"), en soms geeft GitHub een serverfout (500). Daarom: even wachten, en bij een fout HETZELFDE pakket
      # later opnieuw proberen (een nieuw pakket uploaden zou weer te vers zijn).
      - run: sleep 15
      - name: Nieuws online zetten
        id: live1
        continue-on-error: true
        uses: actions/deploy-pages@v4
        with:
          artifact_name: pages-stap1
      - if: steps.live1.outcome == 'failure'
        run: sleep 45
      - name: Nieuws online zetten (opnieuw)
        id: live1b
        if: steps.live1.outcome == 'failure'
        continue-on-error: true
        uses: actions/deploy-pages@v4
        with:
          artifact_name: pages-stap1
      - if: steps.live1b.outcome == 'failure'
        run: sleep 120
      - name: Nieuws online zetten (laatste poging)
        id: live1c
        if: steps.live1b.outcome == 'failure'
        uses: actions/deploy-pages@v4
        with:
          artifact_name: pages-stap1

      # Stap 2: de volledige artikels vertalen en opnieuw online zetten (doet niets als alles al vertaald was)
      - name: Artikels vertalen
        id: texts
        run: |
          if [ -f fetcher/cache/state.pkl ]; then
            python -u fetcher/fetch_news.py --texts
            echo "again=true" >> "$GITHUB_OUTPUT"
          fi
        env:
          FEEDME_KEY: ${{ secrets.FEEDME_KEY }}
      - uses: actions/upload-pages-artifact@v3
        if: steps.texts.outputs.again == 'true'
        with:
          name: pages-stap2
          path: app
      # De lijst met pakketten bij GitHub loopt soms enkele seconden achter op de upload ("No artifacts named ... were
      # found"), en soms geeft GitHub een serverfout (500). Daarom: even wachten, en bij een fout HETZELFDE pakket
      # later opnieuw proberen (een nieuw pakket uploaden zou weer te vers zijn).
      - run: sleep 15
        if: steps.texts.outputs.again == 'true'
      - name: Vertalingen online zetten
        id: deploy
        continue-on-error: true
        if: steps.texts.outputs.again == 'true'
        uses: actions/deploy-pages@v4
        with:
          artifact_name: pages-stap2
      - if: steps.deploy.outcome == 'failure'
        run: sleep 45
      - name: Vertalingen online zetten (opnieuw)
        id: deployb
        if: steps.deploy.outcome == 'failure'
        continue-on-error: true
        uses: actions/deploy-pages@v4
        with:
          artifact_name: pages-stap2
      - if: steps.deployb.outcome == 'failure'
        run: sleep 120
      - name: Vertalingen online zetten (laatste poging)
        id: deployc
        if: steps.deployb.outcome == 'failure'
        continue-on-error: true
        uses: actions/deploy-pages@v4
        with:
          artifact_name: pages-stap2
      # Lukt ook de laatste poging voor de vertalingen niet, dan staat het nieuws wel online en zet de volgende update
      # de vertalingen mee online: een waarschuwing, geen mislukte update (en dus geen foutmail).
      - if: steps.deployc.outcome == 'failure'
        run: echo "::warning::Vertalingen niet online gezet (GitHub-storing); de volgende update zet ze mee online"

      # GitHub zet geplande taken stil na 60 dagen zonder commits; dit houdt de app levend
      - name: Keepalive
        run: |
          last=$(git log -1 --format=%ct)
          if [ $(( $(date +%s) - last )) -gt $(( 50 * 86400 )) ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            date -u > .keepalive
            git add .keepalive
            git commit -m "keepalive"
            git push
          fi
