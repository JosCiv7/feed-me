# Haalt elke 30 minuten het nieuws op, vertaalt het en zet de app online via GitHub Pages.
name: Nieuws bijwerken

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      # vertaalmodellen (± 170 MB) maar één keer downloaden
      - uses: actions/cache@v4
        with:
          path: fetcher/models
          key: argos-models-v2-fr-en-es

      # foto- en vertaalcache van de vorige run hergebruiken
      - uses: actions/cache@v4
        with:
          path: fetcher/cache
          key: feed-cache-${{ github.run_id }}
          restore-keys: feed-cache-

      # FEEDME_KEY = wachtwoord waarmee de volledige artikels versleuteld worden
      - run: python fetcher/fetch_news.py
        env:
          FEEDME_KEY: ${{ secrets.FEEDME_KEY }}

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: app
      - id: deploy
        uses: actions/deploy-pages@v4

      # GitHub zet geplande taken stil na 60 dagen zonder commits; dit houdt de app levend
      - name: Keepalive
        run: |
          last=$(git log -1 --format=%ct)
          if [ $(( $(date +%s) - last )) -gt $(( 50 * 86400 )) ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            date -u > .keepalive
            git add .keepalive
            git commit -m "keepalive"
            git push
          fi
