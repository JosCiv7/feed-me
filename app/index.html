<!doctype html>
<html lang="nl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Feed Me</title>
  <meta name="description" content="Persoonlijk nieuws: België, Brussel, tech en de wereld via lokale bronnen.">
  <meta name="theme-color" content="#f2502f">
  <meta name="robots" content="noindex, nofollow">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="top">
    <a class="brand" href="#" data-tab-link="voorjou">
      <svg class="logo" viewBox="0 0 32 32" aria-hidden="true"><rect x="6" y="4" width="4.5" height="24" rx="2.25" fill="currentColor"/><rect x="6" y="4" width="22" height="4.5" rx="2.25" fill="currentColor"/><rect x="6" y="13.5" width="16" height="4.5" rx="2.25" fill="currentColor"/><circle cx="21" cy="25" r="3" fill="currentColor"/></svg>
      <span>Feed Me</span>
    </a>
    <div class="top-actions">
      <button id="install" class="install" hidden data-i18n="install">Installeer app</button>
      <button id="open-settings" class="icon-btn" aria-label="Instellingen" data-i18n-label="settings">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h10M18 7h2M4 17h4M12 17h8" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><circle cx="16" cy="7" r="2.2" fill="none" stroke="currentColor" stroke-width="2"/><circle cx="10" cy="17" r="2.2" fill="none" stroke="currentColor" stroke-width="2"/></svg>
      </button>
      <button id="refresh" class="icon-btn" aria-label="Vernieuwen" data-i18n-label="refresh">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 12a8 8 0 1 1-2.34-5.66M20 4v5h-5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
    </div>
  </header>

  <nav class="tabs" id="tabs">
    <button data-tab="voorjou" class="active" data-i18n="forYou">Voor jou</button>
    <!-- de rubrieken die je in de instellingen aan hebt staan, komen hier (zie app.js) -->
    <button data-tab="bronnen" data-i18n="sources">Bronnen</button>
  </nav>

  <button id="newsbar" class="newsbar" hidden><b data-i18n="newNews">Nieuw nieuws</b><span data-i18n="tapRefresh">Tik om te vernieuwen</span></button>
  <div id="toast" class="toast" role="status" hidden></div>

  <!-- uitleg om zelf een update te starten; de tekst komt uit app.js, in de gekozen taal -->
  <div id="sheet" class="sheet" hidden><form class="box"></form></div>

  <main id="feed" aria-live="polite">
    <p class="status" data-i18n="loading">Nieuws laden…</p>
  </main>

  <section id="reader" class="reader" hidden aria-label="Artikel"></section>

  <script src="app.js"></script>
</body>
</html>
