<!doctype html>
<html lang="nl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Feed Me</title>
  <meta name="description" content="Persoonlijk nieuws: België, Brussel, tech en de wereld via lokale bronnen.">
  <meta name="theme-color" content="#f2502f">
  <meta name="robots" content="noindex, nofollow">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="top">
    <a class="brand" href="#" data-tab-link="voorjou">
      <svg class="logo" viewBox="0 0 32 32" aria-hidden="true"><rect x="5" y="7" width="22" height="4" rx="2" fill="currentColor"/><rect x="5" y="14" width="16" height="4" rx="2" fill="currentColor"/><rect x="5" y="21" width="10" height="4" rx="2" fill="currentColor"/><circle cx="24.5" cy="23" r="3" fill="currentColor"/></svg>
      <span>Feed Me</span>
    </a>
    <button id="refresh" class="icon-btn" aria-label="Vernieuwen">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 12a8 8 0 1 1-2.34-5.66M20 4v5h-5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </button>
  </header>

  <nav class="tabs" id="tabs">
    <button data-tab="voorjou" class="active">Voor jou</button>
    <button data-tab="belgie" style="--c: var(--sec-belgie)">België</button>
    <button data-tab="brussel" style="--c: var(--sec-brussel)">Brussel</button>
    <button data-tab="spanje" style="--c: var(--sec-spanje)">Spanje</button>
    <button data-tab="europa" style="--c: var(--sec-europa)">Europa</button>
    <button data-tab="wereld" style="--c: var(--sec-wereld)">Wereld</button>
    <button data-tab="conflicten" style="--c: var(--sec-conflicten)">Conflicten</button>
    <button data-tab="economie" style="--c: var(--sec-economie)">Economie</button>
    <button data-tab="tech" style="--c: var(--sec-tech)">Tech</button>
    <button data-tab="wetenschap" style="--c: var(--sec-wetenschap)">Wetenschap</button>
    <button data-tab="mobiliteit" style="--c: var(--sec-mobiliteit)">Mobiliteit</button>
    <button data-tab="bronnen">Bronnen</button>
  </nav>

  <main id="feed" aria-live="polite">
    <p class="status">Nieuws laden…</p>
  </main>

  <section id="reader" class="reader" hidden aria-label="Artikel"></section>

  <script src="app.js"></script>
</body>
</html>
